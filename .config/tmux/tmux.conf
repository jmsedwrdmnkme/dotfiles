# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",tmux-256color"
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g monitor-activity on

bind-key v split-window -h
bind-key s split-window -v

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

# Update status every second
set-option -g status-interval 1

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

## styling

set-option -g status "on"
set -g status-bg '#20202a'
set -g status-fg white
set -g status-style fg=white,bg=default

set -g status-left ' #[fg=cyan]#[fg=black]#[bg=cyan]#I #[bg=#414560]#[fg=white] #W#[fg=#414560]#[bg=#20202a] #[bg=default] '
set -g status-right ' #[fg=magenta]#[fg=black]#[bg=magenta]λ #[fg=white]#[bg=#414560] %a %d %b #[fg=magenta]%R#[fg=#414560]#[bg=#202020] '
#set -g status-justify centre

set -g pane-active-border-style bg='#3b3b4d',fg='#3b3b4d'
set -g pane-border-style fg='#3b3b4d'

set -g window-status-current-format ""
set -g window-status-format ""
